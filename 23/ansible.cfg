[defaults]
inventory=inventory
remote_user=devops
ask_pass=false
roles_path=./roles
collections_paths = ./collections:/usr/share/ansible/collections

[privilege_escalation]
become=True
become_method=sudo
become_user=root
become_ask_pass=False

[galaxy]
server_list = rh-certified_repo, community_repo

[galaxy_server.rh-certified_repo]
url=https://hub.lab.example.com/api/galaxy/content/rh-certified/
token=10ac0e7b80adc91a8f57b0af70970ae170a5112c

[galaxy_server.community_repo]
url=https://hub.lab.example.com/api/galaxy/content/community/
token=10ac0e7b80adc91a8f57b0af70970ae170a5112c
