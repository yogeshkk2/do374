---
- name: Test of Ansible Navigator tool
  hosts: all
  gather_facts: yes
  become: true
  serial: 2
  tasks:
    - name: Deploy webservice
      yum: 
        name: httpd
        state: latest

    - name: Start service
      service: 
        name: httpd
        state: started
        enabled: no

    - name: Add Rule in Firewall
      firewalld: 
        service: http
        permanent: yes
        state: enabled

    - name: Content deployment
      copy:
        content: "HelloWorld\n"
        dest: /var/www/html/index.html
